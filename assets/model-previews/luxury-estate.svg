<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400" width="640" height="400" role="img" aria-labelledby="leTitle">
<title id="leTitle">Prévia visual do modelo Luxury Estate: vitrine imobiliária de alto padrão</title>
<defs>
<linearGradient id="leBg" x1="0" y1="0" x2="0" y2="1">
<stop offset="0%" stop-color="#3a352e"/>
<stop offset="55%" stop-color="#211e1a"/>
<stop offset="100%" stop-color="#121110"/>
</linearGradient>
<linearGradient id="leGlass" x1="0" y1="0" x2="0" y2="1">
<stop offset="0%" stop-color="#e8ddc8" stop-opacity="0.22"/>
<stop offset="100%" stop-color="#e8ddc8" stop-opacity="0.05"/>
</linearGradient>
</defs>
<rect width="640" height="400" fill="url(#leBg)"/>
<!-- horizonte -->
<line x1="0" y1="272" x2="640" y2="272" stroke="#e8ddc8" stroke-opacity="0.12"/>
<!-- fachada arquitetonica abstrata -->
<g>
<rect x="80" y="100" width="220" height="172" fill="#171512" stroke="#C5A059" stroke-opacity="0.4"/>
<rect x="80" y="100" width="220" height="172" fill="url(#leGlass)"/>
<!-- grade de janelas -->
<g stroke="#e8ddc8" stroke-opacity="0.35">
<line x1="124" y1="100" x2="124" y2="272"/>
<line x1="168" y1="100" x2="168" y2="272"/>
<line x1="212" y1="100" x2="212" y2="272"/>
<line x1="256" y1="100" x2="256" y2="272"/>
<line x1="80" y1="140" x2="300" y2="140"/>
<line x1="80" y1="180" x2="300" y2="180"/>
<line x1="80" y1="220" x2="300" y2="220"/>
</g>
<rect x="80" y="100" width="220" height="172" fill="none" stroke="#C5A059" stroke-opacity="0.6"/>
</g>
<!-- segunda torre menor -->
<g>
<rect x="330" y="150" width="120" height="122" fill="#1c1a15" stroke="#C5A059" stroke-opacity="0.35"/>
<rect x="330" y="150" width="120" height="122" fill="url(#leGlass)"/>
<g stroke="#e8ddc8" stroke-opacity="0.3">
<line x1="360" y1="150" x2="360" y2="272"/>
<line x1="390" y1="150" x2="390" y2="272"/>
<line x1="420" y1="150" x2="420" y2="272"/>
<line x1="330" y1="188" x2="450" y2="188"/>
<line x1="330" y1="226" x2="450" y2="226"/>
</g>
</g>
<!-- linhas de planta baixa -->
<g stroke="#C5A059" stroke-opacity="0.4" stroke-width="1" fill="none">
<rect x="470" y="200" width="110" height="72"/>
<line x1="470" y1="236" x2="540" y2="236"/>
<line x1="540" y1="200" x2="540" y2="272"/>
<circle cx="500" cy="252" r="10"/>
</g>
<!-- pin de mapa -->
<g transform="translate(526,120)">
<path d="M0 0 c14 0 24 10 24 24 c0 18 -24 40 -24 40 c0 0 -24 -22 -24 -40 c0 -14 10 -24 24 -24 z" fill="none" stroke="#D8B368" stroke-width="1.6" opacity="0.8"/>
<circle cy="24" r="8" fill="#D8B368" opacity="0.7"/>
</g>
<text x="80" y="330" font-family="Georgia, 'Times New Roman', serif" font-style="italic" font-size="32" fill="#f4f2ec" opacity="0.94">Luxury Estate</text>
<text x="80" y="352" font-family="Arial, sans-serif" font-size="11" letter-spacing="3" fill="#C5A059" opacity="0.8">IMOBILIÁRIO · ALTO PADRÃO</text>
</svg>
